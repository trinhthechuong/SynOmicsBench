[project]
name = "synomicsbench"
version = "1.1.0"
# description = "Add your description here"
readme = "README-pypi.md"
requires-python = ">=3.12"
dependencies = [
    "anonymeter>=1.0.0",
    "baycomp>=1.0.3",
    "codecarbon>=3.2.5",
    "copulas>=0.12.0",
    "ctgan>=0.10.2",
    "deptry>=0.25.1",
    "gseapy>=1.1.12",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "lab>=8.9",
    "lifelines>=0.30.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "memory-profiler>=0.61.0",
    "miceforest>=6.0.5",
    "missingno>=0.5.2",
    "mpl-tools>=0.4.1",
    "mygene>=3.2.2",
    "numba>=0.64.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "polar>=0.0.127",
    "polars>=1.39.2",
    "pytest>=9.0.3",
    "rpy2==3.5.16",
    "scienceplots>=2.2.1",
    "scikit-bio>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sdmetrics>=0.18.0",
    "sdv>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
]

[tool.uv]
# Resolve only for Python 3.12: ctgan>=0.11 requires numpy>=2.1 on Python>=3.13,
# which conflicts with anonymeter's numpy<1.27 ceiling. Pinning the resolution to
# 3.12 is what allows ctgan 0.11.1 (the version used to generate the published
# synthetic data) to coexist with anonymeter. Not published wheel metadata, so
# `requires-python` above stays permissive for downstream users.
environments = ["python_full_version >= '3.12' and python_full_version < '3.13'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synomicsbench"]

[tool.hatch.build]
exclude = [
  "test/test_data/*",
  "Manuscripts/",
  "docs/",
  "site/",
  "*.sif",
  "*.ipynb",
  "*.png",
  "*.pdf",
  "*.csv"
]


