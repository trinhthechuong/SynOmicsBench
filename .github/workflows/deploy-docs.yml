name: Deploy MkDocs

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  RPY2_CFFI_MODE: ABI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          uv pip install --system mkdocs-material mkdocstrings[python] pandas numpy scikit-learn
          uv pip install --system -e . --no-deps

      - name: Deploy to GitHub Pages
        run: |
          python -m mkdocs gh-deploy --force
