name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  RPY2_CFFI_MODE: ABI

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Lint with ruff

        run: |
          uv run ruff check src/synomicsbench

      - name: Run tests
        run: |
          # Chạy các test sanity trước cho nhanh, sau đó là integration tests
          uv run pytest test/ -v
