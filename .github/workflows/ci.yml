name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write        # required to push the test image to GHCR

env:
  RPY2_CFFI_MODE: ABI
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/synomicsbench-test

jobs:
  # ── 1. Lint + unit/processing tests (no R required) ─────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uvx ruff check src/synomicsbench

      - name: Run tests
        run: uv run pytest test/ --ignore=test/test_synthesizers_integration.py -v

  # ── 2. Build & push the R+synthpop test image (runs in parallel with test) ──
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache keyed per-branch — near-instant when Dockerfile.test is unchanged
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Synthesizer integration tests inside the R container ─────────────────
  test-synthesizers:
    runs-on: ubuntu-latest
    needs: [test, build-test-image]   # wait for image to exist before pulling
    container:
      image: ghcr.io/${{ github.repository_owner }}/synomicsbench-test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      R_HOME: /opt/R/4.4.1/lib/R
      RPY2_CFFI_MODE: ABI
      UV_NO_BINARY_PACKAGE: rpy2          # compile rpy2 from source against container's R
      # Keep venv on the container's own overlay filesystem (not the workspace bind-mount).
      # This lets uv hardlink between its cache and the venv instead of copying,
      # halving disk usage and avoiding "No space left on device" (os error 28).
      UV_PROJECT_ENVIRONMENT: /opt/synomics-venv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run synthesizer integration tests
        run: uv run pytest test/test_synthesizers_integration.py -v
