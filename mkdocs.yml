site_name: SynOmicsBench Documentation
site_description: Synthetic data benchmarking for omics data
site_author: SynOmicsBench Team
site_url: https://trinhthechuong.github.io/SynOmicsBench/
repo_url: https://github.com/trinhthechuong/SynOmicsBench
repo_name: SynOmicsBench

# Theme configuration
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    primary: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: default
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

# Navigation Structure (EXACTLY 6 top-level tabs)
nav:
  - Home: index.md
  - Getting Started: getting-started/index.md
  - Preprocessing Data: preprocessing/index.md
  - Generate Synthetic Data: synthetic-data/index.md
  - Evaluation:
      - evaluation/index.md
      - Statistical Fidelity: evaluation/statistical-fidelity.md
      - Biological Utility:
          - DGE: evaluation/biological-utility/dge.md
          - GSEA: evaluation/biological-utility/gsea.md
          - ssGSEA: evaluation/biological-utility/ssgsea.md
          - Cell Type Deconvolution: evaluation/biological-utility/cell-deconvolution.md
          - Survival Analysis: evaluation/biological-utility/survival-analysis.md
      - Biological Results: evaluation/biological-results.md
      - Privacy: evaluation/privacy.md
      - Automatic Benchmark: evaluation/autobenchmark.md
  - API: api/index.md

# Documentation Directory
docs_dir: docs

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2

# Custom CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
